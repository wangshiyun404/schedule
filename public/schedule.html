<!DOCTYPE html>
<html lang="zh-CN" class="calendar-page">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>课表与行程 · 王世赟</title>
<meta name="description" content="王世赟（汕头大学）的公开日程、课程与行程，实时同步自个人日历。空闲时段欢迎来找我。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%276%27 fill=%27%232e6b66%27/%3E%3Crect x=%277%27 y=%279%27 width=%2718%27 height=%2715%27 rx=%272%27 fill=%27%23f6f3ec%27/%3E%3Crect x=%277%27 y=%279%27 width=%2718%27 height=%275%27 fill=%27%23b5542b%27/%3E%3C/svg%3E">
<link rel="stylesheet" href="./style.css?v=6">
<link rel="stylesheet" href="./site.css?v=2">
<link rel="stylesheet" href="./calendar-view.css?v=1">
</head>
<body>
<nav class="topnav"><div class="wrap">
  <a class="brand" href="index.html">王世赟<small>Wang Shiyun · 汕头大学</small></a>
  <div class="navlinks">
    <a href="index.html">首页</a>
    <a href="research.html">研究</a>
    <a href="teaching.html">教学</a>
    <a href="builders.html">AI 信源</a>
    <a href="schedule.html">日程</a>
    <a href="index.html#contact">联系</a>
  </div>
</div></nav>
<main class="wrap calendar-main">
  <header class="calendar-heading">
    <div><h1>课表与行程</h1><p>王世赟 · 汕头大学 · 北京时间（UTC+8）</p></div>
    <div class="calendar-status" aria-live="polite"><strong id="calendar-status">正在读取日历…</strong><span id="calendar-next"></span></div>
  </header>
  <p id="calendar-notice" class="calendar-notice" role="status" hidden></p>
  <section aria-label="公开课表与行程">
    <div class="calendar-toolbar">
      <button class="control" id="calendar-today">今天</button>
      <button class="control" id="calendar-prev" aria-label="上一段日期">‹</button>
      <button class="control" id="calendar-next-date" aria-label="下一段日期">›</button>
      <h2 id="calendar-range">课表与行程</h2>
      <input class="control date-picker" id="calendar-date" type="date" aria-label="跳转到日期">
      <div class="view-switch" aria-label="日历视图">
        <button class="control" data-calendar-view="month" aria-pressed="true">月历</button>
        <button class="control" data-calendar-view="week" aria-pressed="false">周课表</button>
        <button class="control" data-calendar-view="agenda" aria-pressed="false">完整清单</button>
      </div>
    </div>
    <div class="calendar-filters" aria-label="筛选日程">
      <button class="filter-button" data-calendar-filter="all" aria-pressed="true">全部</button>
      <button class="filter-button type-course" data-calendar-filter="course" aria-pressed="false"><i></i>课程</button>
      <button class="filter-button type-meeting" data-calendar-filter="meeting" aria-pressed="false"><i></i>组会与会议</button>
      <button class="filter-button type-trip" data-calendar-filter="trip" aria-pressed="false"><i></i>行程</button>
      <button class="filter-button type-other" data-calendar-filter="other" aria-pressed="false"><i></i>其他</button>
      <input class="calendar-search" id="calendar-search" type="search" placeholder="搜索课程、事项或地点" aria-label="搜索课程、事项或地点">
    </div>
    <div class="calendar-layout">
      <div class="calendar-surface" id="calendar-surface" aria-label="日历内容"></div>
      <aside class="calendar-day-panel" aria-labelledby="calendar-day-title">
        <h2 id="calendar-day-title">当天安排</h2><p class="day-subtitle" id="calendar-day-subtitle"></p>
        <div class="day-jumps"><button class="control" id="day-today">看今天</button><button class="control" id="day-tomorrow">看明天</button></div>
        <ul class="day-items" id="calendar-day-items"></ul>
      </aside>
    </div>
    <div class="calendar-bottom"><p>月历可滚动查看整月；点击日期看当天全部安排，点击事项看详情。</p><p id="calendar-updated">同步中…</p></div>
  </section>
  <div class="calendar-quick">
    <section aria-labelledby="trips-title"><h2 id="trips-title">近期行程与特别安排</h2><div class="quick-events" id="calendar-special"></div></section>
    <section id="find-me" aria-labelledby="slots-title"><h2 id="slots-title">找我聊聊</h2><div class="free-slots" id="calendar-slots"></div><p class="calendar-contact" id="calendar-contact"></p></section>
  </div>
  <footer class="calendar-bottom"><p>仅显示已公开的课表与行程。临时调课、地点及待定事项，以最新通知为准。</p><a href="teaching.html">课程介绍 →</a></footer>
</main>
<dialog class="event-dialog" id="calendar-event-dialog" aria-labelledby="event-dialog-title">
 <button class="dialog-close" id="event-dialog-close" aria-label="关闭事项详情">×</button>
 <span class="dialog-type" id="event-dialog-type"></span><h2 id="event-dialog-title"></h2><dl id="event-dialog-details"></dl>
</dialog>
<script src="./calendar-model.js?v=1"></script>
<script src="./calendar-view.js?v=1"></script>
<script>document.querySelectorAll('.navlinks a').forEach(a=>{if(a.getAttribute('href')==='schedule.html')a.classList.add('active')});</script>
</body></html>
