stages.forEach((s,i)=>{const [x,y,l]=positions[i];const label=document.createElement('button');label.type='button';label.className='station';label.dataset.i=i;label.style.cssText=`--x:${x}%;--label-y:${l}%;--mobile-y:${i*200+15}px`;label.innerHTML=`<span class="date">${s.shortDate}</span><h2>${s.title}</h2><span class="brief">${s.brief.join('<br>')}</span><span class="deliver">交付：${s.output}</span>`;label.addEventListener('click',()=>go(i));map.appendChild(label);const node=document.createElement('button');node.type='button';node.className='node';node.dataset.i=i;node.style.cssText=`--x:${x}%;--node-y:${y}%;--mobile-node-y:${i*200+110}px`;node.textContent=s.n;node.setAttribute('aria-label',`第${s.n}站 ${s.title}`);node.addEventListener('click',()=>go(i));map.appendChild(node)});
function points(){const r=map.getBoundingClientRect();return [...map.querySelectorAll('.node')].map(el=>{const b=el.getBoundingClientRect();return{x:b.left-r.left+b.width/2,y:b.top-r.top+b.height/2}})}
function mobile(){return window.innerWidth<=620}
function segments(a,b){if(mobile())return{a,b,curve:false};return{a,b,curve:Math.abs(a.x-b.x)<5&&Math.abs(a.y-b.y)>20}}
function travel(seg,t){if(seg.curve){const dx=Math.min(85,map.clientWidth*.06);const u=1-t;return{x:u*u*u*seg.a.x+3*u*u*t*(seg.a.x+dx)+3*u*t*t*(seg.b.x+dx)+t*t*t*seg.b.x,y:u*u*u*seg.a.y+3*u*u*t*seg.a.y+3*u*t*t*seg.b.y+t*t*t*seg.b.y}}return{x:seg.a.x+(seg.b.x-seg.a.x)*t,y:seg.a.y+(seg.b.y-seg.a.y)*t}}
function place(p,hop=0,flip=false){const w=rabbit.getBoundingClientRect().width;const h=w*2/3;const offset=mobile()?-w*.5:-w*.38;rabbit.style.transform=`translate(${p.x+offset}px,${p.y-h-18-hop}px) scaleX(${flip?-1:1}) rotate(${hop?(flip?7:-7):0}deg)`;shadow.style.transform=`translate(${p.x-33}px,${p.y-9}px) scale(${1-hop/150})`;shadow.style.opacity=String(.9-hop/100)}
function draw(){const ps=points(),svg=document.getElementById('route');svg.setAttribute('viewBox',`0 0 ${map.clientWidth} ${map.clientHeight}`);let d=`M${ps[0].x} ${ps[0].y}`;for(let i=1;i<ps.length;i++){const seg=segments(ps[i-1],ps[i]);if(seg.curve){const dx=Math.min(85,map.clientWidth*.06);d+=` C${seg.a.x+dx} ${seg.a.y} ${seg.b.x+dx} ${seg.b.y} ${seg.b.x} ${seg.b.y}`}else d+=` L${ps[i].x} ${ps[i].y}`};document.getElementById('trail').setAttribute('d',d);document.getElementById('directions').innerHTML=ps.slice(1).map((p,i)=>{const seg=segments(ps[i],p),q=travel(seg,.55),q2=travel(seg,.56),angle=Math.atan2(q2.y-q.y,q2.x-q.x)*180/Math.PI;return `<path class="direction" d="M-8 -6 L3 0 L-8 6" transform="translate(${q.x} ${q.y}) rotate(${angle})"/>`}).join('');if(!moving)place(ps[current],0,!mobile()&&current>=3)}
function update(){map.querySelectorAll('[data-i]').forEach(el=>{const i=+el.dataset.i;if(i===current)el.setAttribute('aria-current','step');else el.removeAttribute('aria-current');el.classList.toggle('done',i<current)});const s=stages[current];document.getElementById('details').classList.toggle('first-station',current===0);document.getElementById('tasks-label').textContent=s.taskHeading||'这一站，团队一起做';document.getElementById('detail-date').textContent=`第${s.n}站　${s.shortDate}`;document.getElementById('detail-title').textContent=s.title;document.getElementById('detail-question').textContent=s.question;document.getElementById('tasks').replaceChildren(...s.tasks.map(t=>{const li=document.createElement('li');if(current===0){const k=t.indexOf('：'),strong=document.createElement('strong');strong.textContent=t.slice(0,k+1);li.append(strong,document.createTextNode(t.slice(k+1)))}else li.textContent=t;return li}));document.getElementById('handoff').textContent=s.handoff;document.getElementById('example').textContent=s.example;document.getElementById('paths').style.display=current===0?'flex':'none';document.getElementById('handoff-label').textContent=current===5?'留下什么':'交给下一站';document.getElementById('prev').disabled=current===0;document.getElementById('next').disabled=current===5}
function stop(){playing=false;clearTimeout(timer);timer=null;document.getElementById('play').textContent='自动讲解';document.getElementById('play').setAttribute('aria-pressed','false')}
async function go(index,auto=false){if(index<0||index>5||moving)return;if(!auto)stop();const start=current;if(start===index){update();return}moving=true;document.getElementById('map').setAttribute('aria-busy','true');const step=index>start?1:-1;for(let i=start;i!==index;i+=step){const ps=points(),a=ps[i],b=ps[i+step],seg=segments(a,b),flip=b.x<a.x;await new Promise(resolve=>{if(reduce.matches){place(b,0,flip);resolve();return}const begin=performance.now(),duration=800;function frame(now){const raw=Math.min(1,(now-begin)/duration),t=raw*raw*(3-2*raw);place(travel(seg,t),Math.sin(Math.PI*raw)*(mobile()?20:34),flip);if(raw<1)animation=requestAnimationFrame(frame);else resolve()}animation=requestAnimationFrame(frame)});current=i+step;update()}moving=false;map.removeAttribute('aria-busy');draw();if(auto&&playing){if(current<5)timer=setTimeout(()=>go(current+1,true),12000);else stop()}}
document.getElementById('prev').onclick=()=>go(current-1);document.getElementById('next').onclick=()=>go(current+1);document.getElementById('play').onclick=()=>{if(playing){stop();return}if(moving)return;playing=true;document.getElementById('play').textContent='暂停讲解';document.getElementById('play').setAttribute('aria-pressed','true');if(current===5){current=0;update();draw()}timer=setTimeout(()=>go(current+1,true),12000)};
document.getElementById('full').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch{document.getElementById('full').textContent='请使用浏览器全屏'}};document.addEventListener('fullscreenchange',()=>document.getElementById('full').textContent=document.fullscreenElement?'退出全屏':'全屏');document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'){e.preventDefault();go(current+1)}if(e.key==='ArrowLeft'){e.preventDefault();go(current-1)}});new ResizeObserver(draw).observe(map);rabbit.addEventListener('load',draw);update();draw();window.roadmap={go,get current(){return current},stages};
</script></body></html>
